<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>lemonPPT 编辑器</title>
  <link rel="stylesheet" href="/deck/assets/fonts/fonts.css">
  <script src="/deck/assets/jquery.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --lp-bg: #1a1a1a;
      --lp-panel: #1e1e1e;
      --lp-border: #333;
      --lp-text: #e5e5e5;
      --lp-text-secondary: #aaa;
      --lp-primary: #34d399;
      --lp-accent: #3b82f6;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lp-editor-body {
      display: block;
    }
    .lp-deck {
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
    }
    .lp-error {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fee2e2;
      color: #991b1b;
      font-family: system-ui, sans-serif;
    }
    .lp-editor-root {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      color: #e5e5e5;
      overflow: hidden;
    }
    .lp-editor-bar {
      position: relative;
      width: 100%;
      height: 64px;
      box-sizing: border-box;
      border-bottom: 1px solid #333;
      background: #1e1e1e;
      color: #e5e5e5;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }
    .lp-editor-title {
      margin-right: auto;
      font-size: 16px;
      font-weight: 600;
    }
    .lp-appearance-switcher {
      display: inline-flex;
      align-items: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }
    .lp-appearance-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      color: #aaa;
      border: none;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .lp-appearance-btn:hover {
      color: #e5e5e5;
    }
    .lp-appearance-active {
      background: #3a3a3a;
      color: #fff;
      font-weight: 500;
    }
    .lp-editor-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #2a2a2a;
      color: #e5e5e5;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      line-height: 1.4;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .lp-editor-btn:hover:not(:disabled) {
      background: #333;
      border-color: #555;
    }
    .lp-editor-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .lp-editor-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .lp-editor-btn-primary {
      background: #34d399;
      border-color: #34d399;
      color: #111;
      font-weight: 600;
    }
    .lp-editor-btn-primary:hover:not(:disabled) {
      background: #10b981;
      border-color: #10b981;
    }
    .lp-editor-select {
      background: #2a2a2a;
      color: #e5e5e5;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      max-width: 120px;
    }
    .lp-editor-select:focus {
      border-color: #5b8cff;
    }
    .lp-editor-export {
      position: relative;
    }
    .lp-editor-export-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .lp-editor-caret {
      font-size: 10px;
      line-height: 1;
      transform: translateY(1px);
    }
    .lp-editor-export-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .lp-editor-export-menu[hidden] {
      display: none !important;
    }
    .lp-editor-export-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    .lp-editor-export-item:hover {
      background: #3a3a3a;
    }
    .lp-editor-export-icon {
      width: 20px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }
    .lp-editor-export-label {
      flex: 1;
    }
    .lp-editor-export-tag {
      font-size: 11px;
      color: #999;
      background: #3a3a3a;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .lp-editor-workspace {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .lp-editor-left-panel {
      width: 180px;
      flex: none;
      background: #1e1e1e;
      border-right: 1px solid #333;
      overflow-y: auto;
      padding: 12px;
      position: relative;
    }
    .lp-editor-right-panel {
      width: 400px;
      flex: none;
      background: #1e1e1e;
      border-left: 1px solid #333;
      overflow-y: auto;
      padding: 16px;
    }
    .lp-editor-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background-color: #1a1a1a;
      background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      background-position: center center;
    }
    .lp-editor-stage-scaler {
      transform-origin: center center;
      transition: transform 0.2s ease;
      position: relative;
    }
    .lp-editor-page-counter {
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      font-size: 13px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .lp-editor-thumbnails {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lp-thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid transparent;
      border-radius: 6px;
      background: #2a2a2a;
      cursor: grab;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px;
      text-align: left;
      color: #bbb;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    .lp-thumbnail:hover {
      background: #333;
    }
    .lp-thumbnail:focus-visible {
      border-color: #5b8cff;
    }
    .lp-thumbnail.active {
      border-color: #3b82f6;
      background: #26354f;
      color: #fff;
    }
    .lp-thumbnail.dragging,
    .lp-thumbnail:active {
      cursor: grabbing;
    }
    .lp-thumbnail.dragging {
      opacity: 0.45;
      border: 2px dashed #3b82f6;
      background: #1f2937;
    }
    .lp-thumbnail.drag-over {
      border-color: #10b981;
      background: #1f3d32;
    }
    .lp-thumbnail-index {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .lp-thumbnail-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .lp-thumbnail-layout {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    .lp-thumbnail-drag-handle {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 20px;
      height: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      opacity: 0.45;
      z-index: 4;
      color: #888;
      transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
      line-height: 1;
      font-size: 10px;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      border-radius: 4px;
      padding: 2px;
    }
    .lp-thumbnail:hover .lp-thumbnail-drag-handle,
    .lp-thumbnail-drag-handle:hover {
      opacity: 0.9;
      color: #bbb;
      background: rgba(255, 255, 255, 0.08);
    }
    .lp-thumbnail.dragging .lp-thumbnail-drag-handle {
      opacity: 1;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }
    .lp-thumbnail-drop-indicator {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: #3b82f6;
      border-radius: 2px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.1s ease;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
    }
    .lp-thumbnail-drop-indicator.visible {
      opacity: 1;
    }
    .lp-property-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .lp-property-empty {
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }
    .lp-property-group {
      margin-bottom: 16px;
    }
    .lp-property-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
      display: block;
    }
    .lp-property-input,
    .lp-property-textarea {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e5e5e5;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .lp-property-input:focus,
    .lp-property-textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .lp-property-textarea {
      min-height: 80px;
      resize: vertical;
    }
    .lp-add-slide-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .lp-add-slide-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lp-add-slide-modal {
      width: 600px;
      max-width: 90vw;
      max-height: 80vh;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .lp-add-slide-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #333;
    }
    .lp-add-slide-modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .lp-add-slide-modal-close {
      background: transparent;
      border: none;
      color: #888;
      font-size: 20px;
      cursor: pointer;
    }
    .lp-add-slide-modal-close:hover {
      color: #fff;
    }
    .lp-add-slide-modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }
    .lp-add-slide-section-title {
      font-size: 13px;
      font-weight: 600;
      color: #bbb;
      margin: 16px 0 10px;
    }
    .lp-add-slide-section-title:first-child {
      margin-top: 0;
    }
    .lp-add-slide-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .lp-add-slide-item {
      aspect-ratio: 16 / 9;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      padding: 8px;
      text-align: center;
    }
    .lp-add-slide-item:hover {
      background: #333;
      border-color: #5b8cff;
    }
    .lp-add-slide-item-icon {
      font-size: 24px;
      color: #888;
    }
    .lp-add-slide-item-label {
      font-size: 12px;
      color: #bbb;
    }
    .lp-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #1a1a1a;
      color: #e5e5e5;
      z-index: 3000;
    }
    .lp-loading.hidden {
      display: none;
    }
    .lp-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #34d399;
      border-radius: 50%;
      animation: lp-spin 0.8s linear infinite;
    }
    @keyframes lp-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="lp-editor-body">
  <div id="lp-loading" class="lp-loading">
    <div class="lp-spinner"></div>
    <div>正在加载编辑器...</div>
  </div>
  <div id="lp-editor-root" class="lp-editor-root" style="display:none;">
    <div id="lp-editor-bar" class="lp-editor-bar"></div>
    <div class="lp-editor-workspace">
      <aside id="lp-left-panel" class="lp-editor-left-panel"></aside>
      <main class="lp-editor-stage">
        <div class="lp-editor-stage-scaler">
          <div id="lp-slides"></div>
          <div class="lp-editor-page-counter"><span id="lp-current">1</span> / <span id="lp-total">1</span></div>
        </div>
        <div class="lp-editor-zoom-bar">
          <button id="lp-zoom-out" title="缩小">－</button>
          <input type="range" id="lp-zoom-slider" min="35" max="150" value="100">
          <button id="lp-zoom-in" title="放大">＋</button>
          <button id="lp-zoom-fit" title="适应画布">适应</button>
          <span id="lp-zoom-value">100%</span>
        </div>
      </main>
      <aside id="lp-right-panel" class="lp-editor-right-panel"></aside>
    </div>
    <div id="lp-modal"></div>
  </div>

  <script src="/editor.js"></script>
</body>
</html>
